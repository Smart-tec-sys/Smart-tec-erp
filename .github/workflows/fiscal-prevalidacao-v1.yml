name: Fiscal V1 - Pre-validacao NF-e

on:
  push:
    branches:
      - 'feat/fiscal-v1-preparacao-nfe-20261114'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscal_ci
          POSTGRES_PASSWORD: fiscal_ci_test_only
          POSTGRES_DB: smarttec_fiscal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscal_ci -d smarttec_fiscal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://fiscal_ci:fiscal_ci_test_only@127.0.0.1:5432/smarttec_fiscal_ci
      SMARTTEC_AUTH_MODE: dev
      SMARTTEC_ENV: local
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalacao minima para testes
        run: python -m pip install "fastapi==0.136.3" "SQLAlchemy==2.0.49" "pydantic==2.13.4" "PyJWT[crypto]" "python-dotenv==1.2.2" "psycopg2-binary==2.9.11" "httpx==0.28.1"
      - name: Compilar modulos fiscais sem executar API
        run: python -m py_compile app/services/fiscal_nfe_preparacao.py app/services/fiscal_nfe_cadastros.py app/routes/pedido.py app/services/fiscal_cadastros.py app/routes/fiscal_cadastros.py app/schemas/fiscal_cadastros.py app/models/fiscal_produto.py tests/test_fiscal_nfe_preparacao.py tests/test_fiscal_cadastros.py tests/test_fiscal_postgres_homologacao.py
      - name: Testes de pre-validacao e isolamento
        run: python -m unittest -v tests/test_fiscal_nfe_preparacao.py tests/test_fiscal_cadastros.py tests/test_fiscal_postgres_homologacao.py
      - name: Preparar Node.js frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-erp/package-lock.json
      - name: Instalar dependências frontend
        working-directory: frontend-erp
        run: npm ci --no-audit --no-fund
      - name: Compilar frontend fiscal
        working-directory: frontend-erp
        run: npm run build
      - name: Construir a prévia visual isolada e sem API
        working-directory: frontend-erp
        run: |
          npx vite build --config vite.fiscal-qa.config.ts
          test -s dist-fiscal-qa/qa-fiscal.html
          cp dist-fiscal-qa/qa-fiscal.html dist-fiscal-qa/index.html
          test -s dist-fiscal-qa/index.html
          grep -q "Smart-tec ERP" dist-fiscal-qa/index.html
