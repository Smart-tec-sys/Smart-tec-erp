name: Fiscal V1 - Pre-validacao NF-e

on:
  push:
    branches:
      - 'feat/fiscal-v1-preparacao-nfe-20261114'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:////tmp/smarttec-fiscal-ci.db
      SMARTTEC_AUTH_MODE: dev
      SMARTTEC_ENV: local
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalacao minima para testes
        run: python -m pip install "fastapi==0.136.3" "SQLAlchemy==2.0.49" "pydantic==2.13.4" "PyJWT[crypto]" "python-dotenv==1.2.2"
      - name: Compilar modulos fiscais sem executar API
        run: python -m py_compile app/services/fiscal_nfe_preparacao.py app/routes/pedido.py app/services/fiscal_cadastros.py app/routes/fiscal_cadastros.py app/schemas/fiscal_cadastros.py app/models/fiscal_produto.py tests/test_fiscal_nfe_preparacao.py tests/test_fiscal_cadastros.py
      - name: Testes de pre-validacao e isolamento
        run: python -m unittest -v tests/test_fiscal_nfe_preparacao.py tests/test_fiscal_cadastros.py
