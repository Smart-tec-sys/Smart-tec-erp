name: Validar catálogo e orçamento (PR)

on:
  push:
    branches:
      - 'fix/catalogo-colecoes-cores-20261114'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-erp
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-erp/package-lock.json
      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund
      - name: TypeScript e build completo
        run: npm run build
      - name: Preparar transpilador isolado para testes
        run: npm install --prefix /tmp/smarttec-test-ts --no-save --no-audit --no-fund --ignore-scripts typescript@5.8.3
      - name: Testes de regressão do catálogo
        run: node tests/catalogo-colecoes.test.cjs
      - name: Instalar navegador de teste isolado
        run: |
          npm install --prefix /tmp/smarttec-qa-browser --no-save --no-audit --no-fund --ignore-scripts playwright@1.55.0
          node /tmp/smarttec-qa-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Homologar interface do orçamento com catálogo fictício
        run: |
          (npm run dev -- --host 127.0.0.1 --port 5175 > /tmp/smarttec-vite-qa.log 2>&1) &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          node tests/catalogo-ui.test.cjs

